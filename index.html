<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<title>후쿠오카 3박 4일</title>
<style>
:root{
  --bg:#f6f4ef; --card:#fff; --ink:#1f1d1a; --sub:#6b665e; --line:#e4dfd5;
  --accent:#c2410c; --accent-soft:#fdeee4; --blue:#1d4ed8; --blue-soft:#e8eefc;
  --green:#15803d; --green-soft:#e6f4ea; --violet:#6d28d9; --violet-soft:#f0eafd;
  --amber:#a16207; --amber-soft:#fdf4dc; --gray-soft:#efece6;
  --tab-h:64px; --top-h:52px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#161513; --card:#201f1c; --ink:#ece8e1; --sub:#a39d93; --line:#34312c;
  --accent:#fb923c; --accent-soft:#3a2518; --blue:#93b4fb; --blue-soft:#1c2540;
  --green:#6ee7a0; --green-soft:#16301f; --violet:#c4b0fb; --violet-soft:#2a2140;
  --amber:#fcd34d; --amber-soft:#3a2f12; --gray-soft:#2a2824;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);overflow:hidden;
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto}

/* top bar */
.top{flex:none;height:calc(var(--top-h) + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 12px 0;
  display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line);background:var(--bg)}
.top h1{flex:1;margin:0;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:40px;height:40px;border:0;background:none;color:var(--ink);font-size:26px;line-height:1;border-radius:10px;cursor:pointer;display:grid;place-items:center}
.iconbtn[hidden]{display:none}
.top .badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--accent);color:#fff}

/* view */
#view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 20px}
.fade{animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* tab bar */
.tabbar{flex:none;height:calc(var(--tab-h) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);
  display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--card)}
.tabbar button{border:0;background:none;color:var(--sub);font:inherit;font-size:11.5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
.tabbar button .ic{font-size:21px;line-height:1;filter:grayscale(1);opacity:.7}
.tabbar button[aria-current=true]{color:var(--ink);font-weight:700}
.tabbar button[aria-current=true] .ic{filter:none;opacity:1}

/* building blocks */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.card+.card,.card+.grid,.grid+.card,.list+.card,.card+.list{margin-top:10px}
.muted{color:var(--sub)} .small{font-size:13px}
h2.sec{font-size:13px;color:var(--sub);font-weight:600;margin:18px 4px 8px;letter-spacing:.02em}
h2.sec:first-child{margin-top:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;min-height:84px;display:flex;flex-direction:column;justify-content:space-between}
.tile .ic{font-size:22px}
.tile .t{font-weight:700;font-size:14.5px}
.tile .s{font-size:12px;color:var(--sub)}
.list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;min-height:56px}
.row:last-child{border-bottom:0}
.row .tm{flex:none;width:44px;font-variant-numeric:tabular-nums;font-weight:700;font-size:13.5px;color:var(--sub)}
.row .bar{flex:none;width:4px;align-self:stretch;border-radius:4px;background:var(--sub)}
.row .mid{flex:1;min-width:0}
.row .ttl{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{font-size:12.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .chev{flex:none;color:var(--sub);font-size:18px}
.row.static{cursor:default}
.k-food .bar{background:var(--accent)} .k-move .bar{background:var(--blue)} .k-see .bar{background:var(--green)}
.k-shop .bar{background:var(--violet)} .k-rest .bar{background:var(--amber)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px}
.t-food{background:var(--accent-soft);color:var(--accent)} .t-move{background:var(--blue-soft);color:var(--blue)}
.t-see{background:var(--green-soft);color:var(--green)} .t-shop{background:var(--violet-soft);color:var(--violet)}
.t-rest{background:var(--amber-soft);color:var(--amber)}
.must{border:1.5px solid var(--accent)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--gray-soft);padding:4px;border-radius:12px;margin-bottom:12px}
.seg button{border:0;background:none;font:inherit;font-size:13.5px;padding:8px 0;border-radius:9px;color:var(--sub);cursor:pointer}
.seg button small{display:block;font-size:11px}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;font-weight:600;font-size:14px;cursor:pointer;font-family:inherit}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
dl.kv{display:grid;grid-template-columns:78px 1fr;gap:8px 12px;margin:0}
dl.kv dt{color:var(--sub);font-size:13px}
dl.kv dd{margin:0;font-size:14px}
ul.tips{margin:0;padding-left:18px}
ul.tips li+li{margin-top:4px}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.check:last-child{border-bottom:0}
.check input{width:20px;height:20px;margin:1px 0 0;flex:none;accent-color:var(--green)}
.check.done .tx{color:var(--sub);text-decoration:line-through}
.check .tx small{display:block;color:var(--sub);font-size:12px}
.hero{background:linear-gradient(135deg,var(--accent-soft),var(--blue-soft));border:1px solid var(--line);border-radius:20px;padding:16px}
.hero .eyebrow{font-size:11.5px;letter-spacing:.12em;font-weight:800;color:var(--accent)}
.hero .big{font-size:22px;font-weight:800;margin-top:4px}
.hero .when{font-size:13px;color:var(--sub);margin-top:2px}
.next{margin-top:12px;background:var(--card);border-radius:14px;padding:12px;border:1px solid var(--line);cursor:pointer}
.next .lab{font-size:11.5px;font-weight:700;color:var(--sub)}
.next .ttl{font-weight:700;font-size:16px;margin-top:2px}
.next .sub{font-size:13px;color:var(--sub)}
.prog{height:8px;background:var(--gray-soft);border-radius:8px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.facts{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--sub);margin-top:8px}
.facts b{color:var(--ink);font-weight:700}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.grid3 .tile{min-height:78px;padding:10px 12px}
.home .mapbox{margin-top:10px;padding:2px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat .l{font-size:11px;color:var(--sub)} .stat .v{font-weight:700;font-size:14.5px}
.steps{display:grid;gap:10px}
.step{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.step .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:12px;font-weight:800;display:grid;place-items:center}
table{border-collapse:collapse;width:100%;font-size:13.5px}
td,th{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td,tr:last-child th{border-bottom:0}
th{color:var(--sub);font-weight:600;white-space:nowrap;width:1%}
.mapbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px;overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto}
svg .sea{fill:var(--blue-soft)}
svg .sg{fill:none;stroke-linecap:round}
svg .sg.sub{stroke:var(--accent);stroke-width:7}
svg .sg.cab{stroke:var(--amber);stroke-width:6}
svg .sg.bus{stroke:var(--blue);stroke-width:4;stroke-dasharray:8 7}
svg .sg.bag{stroke:var(--violet);stroke-width:4;stroke-dasharray:2 7}
svg .sg.dim{opacity:.1}
svg .stn{fill:var(--card);stroke:var(--ink);stroke-width:3}
svg .lbl{fill:var(--ink);font-size:17px;font-weight:800}
svg .tm{fill:var(--blue);font-size:13px;font-weight:700}
svg .nd.dim{opacity:.25}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--sub);margin:8px 4px 0}
.legend i{display:inline-block;width:16px;border-top:3px solid;vertical-align:4px;margin-right:4px}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.pn .btn{display:block;font-size:13px;height:auto;min-height:52px;padding:8px 12px;text-align:left;line-height:1.35}
.pn .btn span{display:block;font-weight:500;color:var(--sub);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pn .btn.r{text-align:right}
.note{font-size:12.5px;color:var(--sub);margin:10px 4px 0}
.plan{display:grid;grid-template-columns:1fr 1.4fr;gap:6px;margin-bottom:10px}
.plan button{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--sub);font:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
.plan button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.plan button[data-plan=B][aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
</style>
</head>

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const pad=n=>String(n).padStart(2,"0");
function now(){return new Date()}
function todayIso(){const d=now();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function curDay(){return D().find(d=>d.iso===todayIso())}
function toMin(t){const m=t.match(/(\d{1,2}):(\d{2})/);return m?+m[1]*60+ +m[2]:0}

/* d-day */
(function(){const s=new Date(2026,8,25),e=new Date(2026,8,28),n=now();n.setHours(0,0,0,0);
 const diff=Math.round((s-n)/864e5),el=$("#dday");
 if(diff>0)el.textContent="D-"+diff;else if(n<=e)el.textContent=(1-diff)+"일차";else el.remove();})();

/* ========== schematic map ========== */
function mapSVG(f){
 const on=d=>{const tg=d.split(" ");if(f==="all")return !tg.every(x=>/^b\d$/.test(x));return tg.includes(f)};
 const hide=d=>d.split(" ").every(x=>/^b\d$/.test(x));
 const sg=(cls,d,path)=>hide(d)?"":`<path class="sg ${cls}${on(d)?"":" dim"}" d="${path}"/>`;
 const nd=(d,inner)=>`<g class="nd${on(d)?"":" dim"}">${inner}</g>`;
 return `<svg viewBox="0 0 400 340" role="img" aria-label="단순화 노선도">
  <path class="sea" d="M0 0H400V44C330 36 290 58 240 44C190 30 140 52 90 40C50 31 20 44 0 38Z"/>
  ${sg("cab","sun","M230 145 C200 170 150 168 120 142")}${sg("cab","sun","M120 142 L165 105")}${sg("cab","sun","M165 105 L230 145")}
  ${sg("cab","fri","M230 145 C280 120 320 118 352 132")}
  ${sg("cab","mon","M230 145 C245 190 262 230 290 262")}
  ${sg("cab","mon","M290 262 C325 235 345 180 352 132")}
  ${sg("bag","fri mon","M236 158 C280 148 318 146 348 146")}
  ${nd("sun",`<circle class="stn" cx="120" cy="142" r="10"/><text class="lbl" x="104" y="176">텐진</text>`)}
  ${nd("sun",`<circle class="stn" cx="165" cy="105" r="9"/><text class="lbl" x="165" y="82" text-anchor="middle">나카스 · 하루요시</text>`)}

  ${nd("fri mon",`<circle class="stn" cx="352" cy="132" r="11"/><text class="lbl" x="352" y="106" text-anchor="middle">공항</text>`)}
  ${nd("mon",`<circle class="stn" cx="290" cy="262" r="10"/><text class="lbl" x="290" y="294" text-anchor="middle">라라포트</text>`)}
  ${on("fri")?'<text class="tm" x="262" y="112">15분</text>':""}

/* ========== rendering helpers ========== */
function row(d,i,it){
 return `<div class="row k-${it.k}${it.must?" must":""}" data-go="#/i/${d.id}/${i}">
   <span class="tm">${it.t}</span><span class="bar"></span>
   <span class="mid"><div class="ttl">${it.must?"⭐ ":""}${esc(it.ttl)}</div><div class="sub">${esc(it.memo)}</div></span>
   <span class="chev">›</span></div>`;
}
function checklist(key,items){
 const st=store.get(key)||{};
 return `<div class="list">${items.map(it=>{const on=st[it.id]??!!it.done;
  return `<label class="check${on?" done":""}"><input type="checkbox" data-ck="${key}" data-id="${it.id}" ${on?"checked":""}>
   <span class="tx" style="flex:1">${esc(it.x)}${it.n?`<small>${esc(it.n)}</small>`:""}</span>
   ${it.tel?`<a class="btn" style="height:36px;padding:0 12px;flex:none" href="tel:${it.tel}" onclick="event.stopPropagation()">☎</a>`:""}</label>`}).join("")}</div>`;
}
function eatLink(e){const ds=D();for(const d of ds){const i=d.items.findIndex(it=>it.m===e.id);if(i>=0)return `#/i/${d.id}/${i}`}return "#/eat"}
function nextItem(){
 const d=curDay(); if(!d) return null;
 const m=now().getHours()*60+now().getMinutes();
 const i=d.items.findIndex(it=>toMin(it.t)>=m-20);
 return i<0?null:{d,i,it:d.items[i]};
}

/* ========== router ========== */
const TAB_OF={tenchika:"days",cheap:"eat",home:"home",days:"days",i:"days",eat:"eat",shop:"shop",souv:"shop",spots:"shop",baby:"shop",living:"shop",buy:"shop",more:"more",map:"more",bag:"more",todo:"more",rain:"more",info:"more",walk:"more",near:"more",route:"more"};
function parse(){
 const p=(location.hash||"#/home").slice(2).split("/");
 let [a,b,c]=p;
 if(a==="shop"&&b){a=b;b=undefined}
 if(a==="more"&&b){a=b;b=undefined}
 return {a:a||"home",b,c};
}
const ROOT=new Set(["home","days","eat","shop","more"]);
function render(){
 const {a,b,c}=parse();
 const fn=a==="i"?()=>S.item(b,c):S[a]?()=>S[a](b,c):S.home;
 const r=fn();
 $("#title").textContent=r.title;
 const v=$("#view"); v.innerHTML=r.html; v.classList.remove("fade"); void v.offsetWidth; v.classList.add("fade"); v.scrollTop=0;
 $("#back").hidden=ROOT.has(a);
 const tab=TAB_OF[a]||"home";
 document.querySelectorAll("#tabbar button").forEach(bt=>bt.setAttribute("aria-current",bt.dataset.tab===tab));
}
window.addEventListener("hashchange",render);
document.addEventListener("click",e=>{
 const g=e.target.closest("[data-go]");
 if(g&&!e.target.closest("input")){
  e.preventDefault();
  if(g.hasAttribute("data-replace")) location.replace(g.dataset.go); else location.hash=g.dataset.go.slice(1);
 }
 const tb=e.target.closest("#tabbar button");
 if(tb){ location.hash="/"+tb.dataset.tab; }
});
document.addEventListener("change",e=>{
 const t=e.target;
 if(t.dataset.eat){const s=store.get("eat")||{};s[t.dataset.eat]=t.checked;store.set("eat",s);render();}
 if(t.dataset.ck){const s=store.get(t.dataset.ck)||{};s[t.dataset.id]=t.checked;store.set(t.dataset.ck,s);render();}
});
$("#back").addEventListener("click",()=>{ if(history.length>1) history.back(); else location.hash="/home"; });
render();
